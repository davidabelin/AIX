<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="AIX Labs: play games against learning agents, peek inside neural nets, and tinker with the math underneath.">
    <meta name="theme-color" content="#0f7b6d">
    <title>{% block title %}AIX{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/aix.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Baskervville:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/hub_theme.css') }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="bg-orb bg-orb-a" aria-hidden="true"></div>
    <div class="bg-orb bg-orb-b" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="{{ url_for('hub.home') }}">
        <img class="brand-mark" src="{{ url_for('static', filename='icons/aix.svg') }}" alt="" width="22" height="22">
        <span>AIX <span class="brand-sub">Labs</span></span>
      </a>
      <nav class="site-nav" aria-label="Labs">
        <a href="{{ url_for('hub.home') }}"{% if request.path == "/" %} aria-current="page"{% endif %}>Hub</a>
        {% for mount in hub_nav_mounts %}
        <a href="/{{ mount.spec.slug }}/">{{ mount.spec.display_name }}</a>
        {% endfor %}
      </nav>
    </header>
    <main class="page" id="main">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <div class="footer-inner">
        <p class="footer-copy aix-footer-copy">
          <img class="copyleft-mark" src="{{ url_for('static', filename='icons/copyleft.svg') }}" alt="" aria-hidden="true" width="16" height="16">
          <span>2026 AIX Protodyne</span>
        </p>
        <nav class="footer-links" aria-label="AIX footer">
          <a href="{{ url_for('hub.surprise_me') }}">Surprise me</a>
          <a href="{{ url_for('hub.contact_page') }}"{% if request.path == "/contact" %} aria-current="page"{% endif %}>Contact Us</a>
          <a href="{{ url_for('hub.privacy_page') }}"{% if request.path == "/privacy" %} aria-current="page"{% endif %}>Privacy</a>
          <a href="{{ url_for('hub.toc_page') }}"{% if request.path == "/toc" %} aria-current="page"{% endif %}>AIX TOC</a>
        </nav>
      </div>
    </footer>
    {% block scripts %}{% endblock %}
  </body>
</html>
